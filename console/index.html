<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evolv recovery console</title>
  <link rel="stylesheet" href="/console.css">
</head>
<body>
  <header>
    <h1>Evolv</h1>
    <a href="/">Back to your app</a>
  </header>

  <nav aria-label="Console sections">
    <button type="button" data-tab="status" aria-selected="true">Status</button>
    <button type="button" data-tab="logs" aria-selected="false">Logs</button>
  </nav>

  <section id="login-help" hidden>
    <h2>Sign in needed</h2>
    <p>This browser has not been signed in to the recovery console yet.</p>
    <p>In the Evolv folder, run <code>npm run console</code>. It opens a signed-in link, and this browser stays signed in afterwards.</p>
  </section>

  <main id="main-content">
    <section id="tab-status" aria-label="Status">
      <dl id="status-list"></dl>
      <p id="status-error" role="alert" hidden></p>
    </section>
    <section id="tab-logs" aria-label="Logs" hidden>
      <pre id="log-view"></pre>
    </section>
  </main>

  <script src="/console.js"></script>
</body>
</html>
